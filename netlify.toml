[build]
  publish = "public"

# Send every apex/www and http variant to one canonical https://kardelenaldemir.com
[[redirects]]
  from = "https://www.kardelenaldemir.com/*"
  to = "https://kardelenaldemir.com/:splat"
  status = 301
  force = true

# Applied to every path. A rule scoped to "/index.html" would NOT cover "/",
# because Netlify matches the requested path, not the resolved file.
# The page is self-contained: no external scripts, styles, fonts or images.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
