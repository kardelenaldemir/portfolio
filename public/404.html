<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Kardelen Aldemir</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta name="theme-color" content="#62A73A">
<style>
  :root { --paper:#FFF; --ink:#0B0B0B; --muted:#33332E; --green:#62A73A;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0B0B0B; --ink:#F2F1EC; --muted:#C4C3BC; } }
  *,*::before,*::after { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:18px;
    padding:clamp(1.25rem,5vw,4rem); -webkit-font-smoothing:antialiased; }
  main { max-width:34rem; }
  h1 { margin:0; font-family:var(--sans); font-weight:800; text-transform:uppercase;
    font-size:clamp(2.4rem,9vw,4.5rem); line-height:0.88; letter-spacing:-0.045em; }
  h1 span { color:var(--green); }
  p { margin:1.4rem 0 0; color:var(--muted); max-width:38ch; }
  a { display:inline-block; margin-top:1.9rem; font-family:var(--sans); font-weight:700;
    font-size:1rem; color:var(--green); text-underline-offset:5px; text-decoration-thickness:3px; }
  a:focus-visible { outline:3px solid var(--green); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>Not<br><span>here</span></h1>
  <p>This page doesn't exist. It may have moved, or the link may be wrong.</p>
  <p lang="tr">Bu sayfa yok. Taşınmış ya da bağlantı hatalı olabilir.</p>
  <a href="/">Go to the homepage &rarr;</a>
</main>
</body>
</html>
